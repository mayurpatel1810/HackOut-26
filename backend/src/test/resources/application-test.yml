spring:
  datasource:
    url: jdbc:h2:mem:ecoforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
ecoforge:
  security:
    jwt-secret: test-secret-key-at-least-32-characters-long
  ai-service:
    base-url: http://localhost:9
  demo:
    seed-on-startup: false
